<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sotto</title>
    <style>
      /* The Sotto palette (lib/core/design/tokens.dart, Sotto Violet). */
      :root {
        --ground: #f5f4fb;
        --card: #ffffff;
        --border: #e5e3f4;
        --ink: #14112b;
        --ink-2: #464360;
        --primary: #5b4bdb;
        --primary-hover: #6e60df;
        --primary-pressed: #402dd5;
        --primary-deep: #4a3bc4;
        --primary-tint: #eeecfd;
        --on-primary: #ffffff;
        --success: #187554;
        --success-tint: rgba(24, 117, 84, 0.1);
        --warning: #985c00;
        --warning-tint: rgba(152, 92, 0, 0.1);
        --champagne: #c9a45c;
        --shadow: 0 1px 2px rgba(32, 21, 96, 0.05), 0 8px 24px -6px rgba(32, 21, 96, 0.08);
        --glow: rgba(91, 75, 219, 0.32);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #14112b;
          --card: #1c1838;
          --border: #2a2647;
          --ink: #efeef6;
          --ink-2: #c6c4d4;
          --primary: #6a5cde;
          --primary-hover: #7265df;
          --primary-pressed: #5343d9;
          --primary-deep: #5a4bd9;
          --primary-tint: #2b255a;
          --success: #52cc97;
          --success-tint: rgba(82, 204, 151, 0.12);
          --warning: #efb04f;
          --warning-tint: rgba(239, 176, 79, 0.12);
          --shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
          --glow: rgba(106, 92, 222, 0.45);
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: 300px; padding: 14px; background: var(--ground); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      header img { width: 28px; height: 28px; }
      h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
      .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--warning-tint); color: var(--warning); }
      .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .pill.on { background: var(--success-tint); color: var(--success); }
      p { margin: 10px 0 0; color: var(--ink-2); }
      .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
      button { font: inherit; font-weight: 500; height: 32px; border-radius: 7px; cursor: pointer; transition: background-color 140ms ease, box-shadow 140ms ease, border-color 140ms ease; }
      button.primary { color: var(--on-primary); border: 0; background: linear-gradient(180deg, var(--primary), var(--primary-deep)); box-shadow: 0 1px 2px rgba(20, 17, 43, 0.22); }
      button.primary:hover { background: linear-gradient(180deg, var(--primary-hover), var(--primary)); box-shadow: 0 0 10px var(--glow); }
      button.primary:active { background: var(--primary-pressed); box-shadow: none; }
      button.secondary { color: var(--ink); background: var(--card); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); }
      button.secondary:hover { background: var(--primary-tint); border-color: color-mix(in srgb, var(--primary) 55%, transparent); }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; box-shadow: 0 0 10px var(--glow); }
      .note { font-size: 12px; }
      .note::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--champagne); margin-right: 6px; vertical-align: 1px; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <header>
        <img src="icons/icon-32.png" alt="" />
        <h1>Sotto</h1>
        <span class="pill" id="status"></span>
      </header>
      <p id="sites-text"></p>
      <div class="actions">
        <button class="primary" id="allow" hidden></button>
        <button class="secondary" id="reconnect"></button>
      </div>
      <p class="note" id="note"></p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
